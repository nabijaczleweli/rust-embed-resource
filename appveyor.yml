image:
  - Visual Studio 2022

version: 3.0.10-{build}

skip_tags: false

clone_folder: C:\rust-embed-resource

environment:
  matrix:
    - TARGET: x86_64-pc-windows-msvc
      TOOLCHAIN: stable

install:
  - set PATH=%PATH%;C:\Users\appveyor\.cargo\bin;C:\Users\appveyor\.pixi\bin
  - curl -SL https://win.rustup.rs/ -oC:\rustup-init.exe
  - C:\rustup-init.exe -y --default-host="%TARGET%" --default-toolchain="%TOOLCHAIN%"
  - powershell -ExecutionPolicy Bypass -c "irm -useb https://pixi.sh/install.ps1 | iex"

build: off
build_script:
  - cargo build --verbose --release --workspace
  - git clone https://github.com/chawyehsu/embed-resource-issue-90-vswhom-cross ../embed-resource-issue-90-vswhom-cross
  - cd ../embed-resource-issue-90-vswhom-cross && sed -ie '8d' -e '9s/# /;s/no-vswhom/no-arm64-vswhom/' Cargo.toml && pixi run build --target-platform win-arm64

notifications:
  - provider: Email
    to:
      - nabijaczleweli@gmail.com
    on_build_status_changed: true
